# https://github.com/DLR-RM/rl-baselines3-zoo/blob/master/hyperparams/ppo.yml

LunarLander-v3:
  normalize: false
  n_envs: 16
  n_timesteps: !!float 1e6
  policy: 'MlpPolicy'
  n_steps: 1024
  batch_size: 256
  gae_lambda: 0.98
  gamma: 0.999
  n_epochs: 4
  ent_coef: 0.01
  learning_rate: 0.0003
  clip_range: 0.2
  vf_coef: 0.5
  normalize_advantage: true
  max_grad_norm: 0.5
  policy_kwargs:
    ortho_init: true
  eval_freq: 1_000

