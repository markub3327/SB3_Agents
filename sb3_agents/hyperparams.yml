# Based on https://github.com/DLR-RM/rl-baselines3-zoo/blob/master/hyperparams/ppo.yml

Taxi-v3:
  normalize: true
  n_envs: 128
  n_timesteps: !!float 1e7
  policy: 'MlpPolicy'
  n_steps: 16
  batch_size: 64
  gae_lambda: 0.98
  gamma: 0.99
  n_epochs: 4
  ent_coef: 0.0
  learning_rate: !!float 2.5e-4
  clip_range: 0.2
  vf_coef: 0.5
  eval_freq: 1_000

