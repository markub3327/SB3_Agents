# https://github.com/DLR-RM/rl-baselines3-zoo/blob/master/hyperparams/ppo.yml

LunarLander-v3:
  normalize: false
  n_envs: 16
  n_timesteps: !!float 1e6
  policy: 'MlpPolicy'
  n_steps: 1024
  batch_size: 64
  gae_lambda: 0.98
  gamma: 0.999
  n_epochs: 4
  ent_coef: 0.01
  learning_rate: 0.0003
  clip_range: 0.2
  vf_coef: 0.5
  normalize_advantage: true
  max_grad_norm: 0.5
  policy_kwargs:
    ortho_init: true
  eval_freq: 1_024

Acrobot-v1:
  normalize:
    norm_obs: true
    norm_reward: false
  n_envs: 16
  n_timesteps: !!float 1e6
  policy: 'MlpPolicy'
  n_steps: 256
  batch_size: 256
  gae_lambda: 0.94
  gamma: 0.99
  n_epochs: 4
  ent_coef: 0.0
  learning_rate: 0.0003
  clip_range: 0.2
  vf_coef: 0.5
  normalize_advantage: true
  max_grad_norm: 0.5
  policy_kwargs:
    ortho_init: true
  eval_freq: 1_024

CartPole-v1:
  normalize: false
  n_envs: 8
  n_timesteps: !!float 1e5
  policy: 'MlpPolicy'
  n_steps: 32
  batch_size: 256
  gae_lambda: 0.8
  gamma: 0.98
  n_epochs: 20
  ent_coef: 0.0
  learning_rate: 0.001
  clip_range: 0.2
  vf_coef: 0.5
  normalize_advantage: true
  max_grad_norm: 0.5
  policy_kwargs:
    ortho_init: true
  eval_freq: 1_024

MountainCar-v0:
  normalize:
    norm_obs: true
    norm_reward: false
  n_envs: 16
  n_timesteps: !!float 1e7
  policy: 'MlpPolicy'
  n_steps: 16
  batch_size: 256
  gae_lambda: 0.98
  gamma: 0.99
  n_epochs: 4
  ent_coef: 0.0
  learning_rate: 0.0003
  clip_range: 0.2
  vf_coef: 0.5
  normalize_advantage: true
  max_grad_norm: 0.5
  policy_kwargs:
    ortho_init: true
  eval_freq: 1_024

ale:
  normalize: false
  frame_stack: 4
  policy: 'CnnPolicy'
  n_envs: 128
  n_steps: 128
  gamma: 0.99
  gae_lambda: 0.85
  n_epochs: 4
  batch_size: 256
  n_timesteps: !!float 1e7
  learning_rate: !!float 2.5e-4
  clip_range: 0.1
  vf_coef: 0.5
  ent_coef: 0.01
  normalize_advantage: true
  max_grad_norm: 0.5
  policy_kwargs:
    optimizer_kwargs:
      eps: 1.0e-5
    ortho_init: true
  eval_freq: 10_000

retro:
  normalize: false
  frame_stack: 4
  policy: 'CnnPolicy'
  n_envs: 128
  n_steps: 8192
  gamma: 0.99
  gae_lambda: 0.70
  n_epochs: 4
  batch_size: 8192
  n_timesteps: !!float 1e8
  learning_rate: !!float 2.5e-4
  clip_range: 0.1
  vf_coef: 0.5
  ent_coef: 0.01
  normalize_advantage: true
  max_grad_norm: 0.5
  policy_kwargs:
    optimizer_kwargs:
      eps: 1.0e-5
    ortho_init: true
  eval_freq: 10_000

### https://github.com/markub3327/MarsExplorer
explorer-v1:
  normalize: true
  frame_stack: 4
  policy: 'CnnPolicy'
  n_envs: 128
  n_steps: 128
  gamma: 0.95
  gae_lambda: 0.95
  n_epochs: 4
  batch_size: 256
  n_timesteps: !!float 1e7
  learning_rate: !!float 2.5e-4
  clip_range: 0.3
  vf_coef: 0.5
  ent_coef: 0.01
  normalize_advantage: true
  max_grad_norm: 0.5
  policy_kwargs:
    optimizer_kwargs:
      eps: 1.0e-5
    ortho_init: true
  eval_freq: 10_000